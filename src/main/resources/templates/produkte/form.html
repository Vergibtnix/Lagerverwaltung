<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<title>Neues Produkt - Lagerverwaltung</title>
	<script>
		(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('produkte')}"></div>

<div class="container">
	<div class="mb-4">
		<h1 class="h3 mb-1" th:text="${isEdit} ? 'Produkt bearbeiten' : 'Neues Produkt'">Neues Produkt</h1>
		<p class="text-muted mb-0">Produktdaten erfassen und Bestand initial setzen.</p>
	</div>

	<form th:action="${isEdit} ? @{/produkte/{id}(id=${produktId})} : @{/produkte}" th:object="${produktForm}" method="post" class="card shadow-sm">
		<div class="card-body">
			<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
				<p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Fehler</p>
			</div>
			<div class="mb-3">
				<label class="form-label" for="name">Name</label>
				<input id="name" type="text" class="form-control" th:field="*{name}">
				<div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label" for="kategorie">Kategorie</label>
				<input id="kategorie" list="kategorieVorschlaege" type="text" class="form-control" th:field="*{kategorie}">
				<datalist id="kategorieVorschlaege">
					<option th:each="kat : ${kategorien}" th:value="${kat}"></option>
				</datalist>
				<div class="text-danger small" th:if="${#fields.hasErrors('kategorie')}" th:errors="*{kategorie}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label" for="beschreibung">Beschreibung</label>
				<textarea id="beschreibung" class="form-control" rows="4" th:field="*{beschreibung}"></textarea>
				<div class="text-danger small" th:if="${#fields.hasErrors('beschreibung')}" th:errors="*{beschreibung}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label" for="bildUrl">Bild-URL (optional)</label>
				<input id="bildUrl" list="bildVorschlaege" type="text" class="form-control" placeholder="https://... oder /img/..." th:field="*{bildUrl}">
				<datalist id="bildVorschlaege">
					<option value="/img/Corny%20Banane.png"></option>
					<option value="/img/KTM%20125%20Duke.png"></option>
					<option value="/img/KTM%20125%20RC.png"></option>
					<option value="/img/KTM%20390%20Adventure.webp"></option>
				</datalist>
				<div class="text-danger small" th:if="${#fields.hasErrors('bildUrl')}" th:errors="*{bildUrl}"></div>
			</div>
			<div class="row">
				<div class="col-md-4 mb-3">
					<label class="form-label" for="preis">Preis</label>
					<input id="preis" type="number" step="0.01" min="0" class="form-control" th:field="*{preis}">
					<div class="text-danger small" th:if="${#fields.hasErrors('preis')}" th:errors="*{preis}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="bestand">Bestand</label>
					<input id="bestand" type="number" min="0" class="form-control" th:field="*{bestand}">
					<div class="text-danger small" th:if="${#fields.hasErrors('bestand')}" th:errors="*{bestand}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="mindestbestand">Mindestbestand</label>
					<input id="mindestbestand" type="number" min="0" class="form-control" th:field="*{mindestbestand}">
					<div class="text-danger small" th:if="${#fields.hasErrors('mindestbestand')}" th:errors="*{mindestbestand}"></div>
				</div>
			</div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary">Speichern</button>
				<a class="btn btn-outline-secondary" th:href="@{/produkte}">Zurück</a>
			</div>
		</div>
	</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
	<meta charset="UTF-8">
	<title>Transaktionen - Lagerverwaltung</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('transaktionen')}"></div>

<div class="container">
	<div class="mb-4">
		<h1 class="h3 mb-1">Alle Transaktionen</h1>
		<p class="text-muted mb-0">Verkaufs- und Nachbestellhistorie in tabellarischer Form.</p>
	</div>

	<div class="row g-4">
		<div class="col-lg-6">
			<div class="card shadow-sm">
				<div class="card-header bg-white">
					<h2 class="h5 mb-0">Verkäufe</h2>
				</div>
				<div class="card-body table-responsive">
					<table class="table table-sm align-middle">
						<thead>
						<tr>
							<th>Datum</th>
							<th>Produkt</th>
							<th>Kunde</th>
							<th>Menge</th>
							<th>Preis</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="verkauf : ${verkaeufe}">
							<td th:text="${#temporals.format(verkauf.verkauftAm, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
							<td th:text="${verkauf.produkt.name}">Produkt</td>
							<td th:text="${verkauf.kundenname}">Kunde</td>
							<td th:text="${verkauf.menge}">0</td>
							<td th:text="${verkauf.gesamtpreis} + ' €'">0 €</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="col-lg-6">
			<div class="card shadow-sm">
				<div class="card-header bg-white">
					<h2 class="h5 mb-0">Nachbestellungen</h2>
				</div>
				<div class="card-body table-responsive">
					<table class="table table-sm align-middle">
						<thead>
						<tr>
							<th>Bestellt am</th>
							<th>Produkt</th>
							<th>Menge</th>
							<th>Lieferant</th>
							<th>Status</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="nachbestellung : ${nachbestellungen}">
							<td th:text="${#temporals.format(nachbestellung.bestelltAm, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
							<td th:text="${nachbestellung.produkt.name}">Produkt</td>
							<td th:text="${nachbestellung.menge}">0</td>
							<td th:text="${nachbestellung.lieferant}">Lieferant</td>
							<td th:text="${nachbestellung.status}">OFFEN</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

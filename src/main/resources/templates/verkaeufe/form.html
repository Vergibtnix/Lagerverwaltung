<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
	<meta charset="UTF-8">
	<title>Verkauf erfassen - Lagerverwaltung</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('verkaeufe')}"></div>

<div class="container">
	<div class="mb-4">
		<h1 class="h3 mb-1">Verkauf erfassen</h1>
		<p class="text-muted mb-0">Ein Produkt auswählen und die verkaufte Menge buchen.</p>
	</div>

	<div class="alert alert-warning" th:if="${#lists.isEmpty(produkte)}">
		Es sind noch keine Produkte angelegt. Bitte zuerst ein Produkt erstellen.
	</div>

	<form th:action="@{/verkaeufe}" th:object="${verkaufForm}" method="post" class="card shadow-sm">
		<div class="card-body">
			<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
				<p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Fehler</p>
			</div>
			<div class="mb-3">
				<label class="form-label" for="produktId">Produkt</label>
				<select id="produktId" class="form-select" th:field="*{produktId}">
					<option value="" selected>Bitte wählen</option>
					<option th:each="produkt : ${produkte}" th:value="${produkt.id}" th:text="|${produkt.name} (Bestand: ${produkt.bestand})|"></option>
				</select>
				<div class="text-danger small" th:if="${#fields.hasErrors('produktId')}" th:errors="*{produktId}"></div>
			</div>
			<div class="mb-3 col-md-4">
				<label class="form-label" for="menge">Menge</label>
				<input id="menge" type="number" min="1" class="form-control" th:field="*{menge}">
				<div class="text-danger small" th:if="${#fields.hasErrors('menge')}" th:errors="*{menge}"></div>
			</div>
			<div class="row">
				<div class="col-md-4 mb-3">
					<label class="form-label" for="kundenname">Kundenname (optional)</label>
					<input id="kundenname" type="text" class="form-control" th:field="*{kundenname}">
					<div class="text-danger small" th:if="${#fields.hasErrors('kundenname')}" th:errors="*{kundenname}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="rabattProzent">Rabatt / Skonto</label>
					<select id="rabattProzent" class="form-select" th:field="*{rabattProzent}">
						<option th:each="rabatt : ${rabattOptionen}" th:value="${rabatt}" th:text="${rabatt} + ' %'"></option>
					</select>
					<div class="text-danger small" th:if="${#fields.hasErrors('rabattProzent')}" th:errors="*{rabattProzent}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="verkauftAm">Verkaufsdatum (optional)</label>
					<input id="verkauftAm" type="datetime-local" class="form-control" th:field="*{verkauftAm}">
					<div class="text-danger small" th:if="${#fields.hasErrors('verkauftAm')}" th:errors="*{verkauftAm}"></div>
				</div>
			</div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary">Speichern</button>
				<a class="btn btn-outline-secondary" th:href="@{/verkaeufe}">Zurück</a>
			</div>
		</div>
	</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

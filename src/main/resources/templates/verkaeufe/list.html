<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<title>Verkäufe - Lagerverwaltung</title>
	<script>
		(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('verkaeufe')}"></div>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1 class="h3 mb-1">Verkäufe</h1>
			<p class="text-muted mb-0">Erfasste Verkäufe und Gesamtumsatz.</p>
		</div>
		<a class="btn btn-primary" th:href="@{/verkaeufe/neu}">Verkauf erfassen</a>
	</div>

	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
	<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

	<div class="card shadow-sm mb-4">
		<div class="card-body">
					<div class="text-muted">Gesamtumsatz</div>
			<div class="h3 mb-0" th:text="${umsatzGesamt} + ' €'">0 €</div>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="table-responsive">
				<table class="table align-middle">
					<thead>
					<tr>
						<th>Datum</th>
						<th>Produkt</th>
						<th>Kunde</th>
						<th>Menge</th>
							<th>Einzelpreis</th>
						<th>Gesamtpreis</th>
						<th></th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="verkauf : ${verkaeufe}">
						<td th:text="${#temporals.format(verkauf.verkauftAm, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
						<td th:text="${verkauf.produkt.name}">Produkt</td>
						<td th:text="${verkauf.kundenname}">Kunde</td>
						<td th:text="${verkauf.menge}">0</td>
						<td th:text="${verkauf.einzelpreis} + ' €'">0 €</td>
						<td th:text="${verkauf.gesamtpreis} + ' €'">0 €</td>
						<td>
							<form th:action="@{/verkaeufe/{id}/loeschen(id=${verkauf.id})}" method="post" class="d-inline">
								<button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
							</form>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

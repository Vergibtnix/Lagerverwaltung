<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<title>Nachbestellung erfassen - Lagerverwaltung</title>
	<script>
		(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('nachbestellungen')}"></div>

<div class="container">
	<div class="mb-4">
		<h1 class="h3 mb-1">Nachbestellung erfassen</h1>
		<p class="text-muted mb-0">Ein Produkt auswählen und Nachbestellbedarf dokumentieren.</p>
	</div>

	<div class="alert alert-warning" th:if="${#lists.isEmpty(produkte)}">
		Es sind noch keine Produkte angelegt. Bitte zuerst ein Produkt erstellen.
	</div>

	<form th:action="@{/nachbestellungen}" th:object="${nachbestellungForm}" method="post" class="card shadow-sm">
		<div class="card-body">
			<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
				<p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Fehler</p>
			</div>
			<div class="mb-3">
				<label class="form-label" for="produktId">Produkt</label>
				<select id="produktId" class="form-select" th:field="*{produktId}">
					<option value="" selected>Bitte wählen</option>
					<option th:each="produkt : ${produkte}" th:value="${produkt.id}" th:text="${produkt.name}"></option>
				</select>
				<div class="text-danger small" th:if="${#fields.hasErrors('produktId')}" th:errors="*{produktId}"></div>
			</div>
			<div class="row">
				<div class="col-md-4 mb-3">
					<label class="form-label" for="menge">Menge</label>
					<input id="menge" type="number" min="1" class="form-control" th:field="*{menge}">
					<div class="text-danger small" th:if="${#fields.hasErrors('menge')}" th:errors="*{menge}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="voraussichtlichesLieferdatum">Voraussichtliches Lieferdatum</label>
					<input id="voraussichtlichesLieferdatum" type="date" class="form-control" th:field="*{voraussichtlichesLieferdatum}">
					<div class="text-danger small" th:if="${#fields.hasErrors('voraussichtlichesLieferdatum')}" th:errors="*{voraussichtlichesLieferdatum}"></div>
				</div>
				<div class="col-md-4 mb-3">
					<label class="form-label" for="lieferant">Lieferant</label>
					<input id="lieferant" type="text" class="form-control" th:field="*{lieferant}">
					<div class="text-danger small" th:if="${#fields.hasErrors('lieferant')}" th:errors="*{lieferant}"></div>
				</div>
			</div>
			<div class="mb-3">
				<label class="form-label" for="bemerkung">Bemerkung</label>
				<textarea id="bemerkung" class="form-control" rows="4" th:field="*{bemerkung}"></textarea>
				<div class="text-danger small" th:if="${#fields.hasErrors('bemerkung')}" th:errors="*{bemerkung}"></div>
			</div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary">Speichern</button>
				<a class="btn btn-outline-secondary" th:href="@{/nachbestellungen}">Zurück</a>
			</div>
		</div>
	</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<title>Nachbestellungen - Lagerverwaltung</title>
	<script>
		(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();
	</script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('nachbestellungen')}"></div>

<div class="container">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1 class="h3 mb-1">Nachbestellungen</h1>
			<p class="text-muted mb-0">Erfasste Nachbestellungen und offene Vorgänge.</p>
		</div>
		<a class="btn btn-primary" th:href="@{/nachbestellungen/neu}">Nachbestellung erfassen</a>
	</div>

	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
	<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

	<div class="card shadow-sm mb-4">
		<div class="card-body">
			<div class="text-muted">Offene Nachbestellungen</div>
			<div class="h3 mb-0" th:text="${#lists.size(offeneNachbestellungen)}">0</div>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="table-responsive">
				<table class="table align-middle">
					<thead>
					<tr>
						<th>Datum</th>
						<th>Produkt</th>
						<th>Menge</th>
						<th>Liefertermin</th>
						<th>Wareneingang</th>
						<th>Lieferant</th>
						<th>Status</th>
						<th></th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="nachbestellung : ${nachbestellungen}">
						<td th:text="${#temporals.format(nachbestellung.bestelltAm, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
						<td th:text="${nachbestellung.produkt.name}">Produkt</td>
						<td th:text="${nachbestellung.menge}">0</td>
						<td th:text="${nachbestellung.voraussichtlichesLieferdatum}">2026-01-01</td>
						<td th:text="${nachbestellung.tatsaechlichesLieferdatum}">2026-01-02</td>
						<td th:text="${nachbestellung.lieferant}">Lieferant</td>
						<td th:text="${nachbestellung.status}">OFFEN</td>
						<td>
							<form th:if="${nachbestellung.status.name() != 'EINGETROFFEN'}" th:action="@{/nachbestellungen/{id}/eingetroffen(id=${nachbestellung.id})}" method="post" class="d-inline">
								<button type="submit" class="btn btn-sm btn-outline-success">Als eingetroffen markieren</button>
							</form>
							<form th:if="${nachbestellung.status.name() != 'EINGETROFFEN'}" th:action="@{/nachbestellungen/{id}/loeschen(id=${nachbestellung.id})}" method="post" class="d-inline ms-1">
								<button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
							</form>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

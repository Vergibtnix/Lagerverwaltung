version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: lagerverwaltung-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: lagerverwaltung
      MARIADB_USER: lagerapp
      MARIADB_PASSWORD: lagerapp
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:

